<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عنوان — مقارنة اختيار النوع</title>
<style>body{font:16px system-ui;margin:24px;background:#eeede9;color:#111}h1{font-size:24px}label{display:inline-block;margin:8px}select{font:inherit;padding:8px;border-radius:8px}.views{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}iframe{border:1px solid #ccc;border-radius:20px;background:#f8f8f6;width:393px;height:852px}h2{text-align:center;font-size:18px}p{line-height:1.8}a{color:#a84118}</style>
<h1>اختيار نوع الصفحة — قبل وبعد</h1><p>لقطتان محفوظتان من المكوّن الفعلي للمقارنة البصرية. جرّب تغيير الأبعاد والتمرير داخل كل نسخة. التفاعل الكامل متاح في <a href="/signup">النسخة الحالية</a>.</p>
<label>مساحة العرض <select id="size"><option value="393,852">393 × 852</option><option value="320,568">320 × 568</option><option value="375,667">375 × 667</option><option value="430,740">430 × 740</option><option value="667,375">667 × 375 أفقي</option></select></label>
<div class="views"><section><h2>قبل</h2><iframe src="before.html" title="قبل التعديل"></iframe></section><section><h2>بعد</h2><iframe src="after.html" title="بعد التعديل"></iframe></section></div>
<script>document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');document.querySelectorAll('iframe').forEach(f=>{f.style.width=w+'px';f.style.height=h+'px'})}</script></html>
