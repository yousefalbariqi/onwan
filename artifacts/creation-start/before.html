KiHGmP+J1xySbIY1OUPiTClf4g3d/e7+Srl3tLDy17A75HeYcrzoIEiyxKU9Y8lPoIkO9DlT5IvZ6/enNv6ZEBktdrq4UR9hNhz3bbZlD16vXefhw/Xnd4Vjo3dub/Z38GNgIAAA==) format('woff2')}*,:before,:after{box-sizing:border-box;margin:0;padding:0;border:0 solid}html{font-size:16px;line-height:1.5}body{margin:0}button,a{font:inherit}a{color:inherit;text-decoration:inherit}svg{display:block;vertical-align:middle}.creation-start__header a:first-child>span{display:inline-flex;align-items:center;gap:10px;color:#111}.creation-start__header a:first-child svg{width:36px;height:36px;flex-shrink:0}.creation-start__header a:first-child span>span{font-size:25.6px;font-weight:700;line-height:1;letter-spacing:-.01em}@media(min-width:640px){.creation-start__header a:first-child svg{width:44px;height:44px}.creation-start__header a:first-child span>span{font-size:32px}}.creation-start {
  --creation-accent: #ff6b2c;
  min-height: 100svh;
  background: #f8f8f6;
  color: #111;
  font-family: 'Cairo', sans-serif;
}
.creation-start__frame { width: min(100%, 760px); margin-inline: auto; padding: 20px 24px max(20px, env(safe-area-inset-bottom)); }
.creation-start__header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.creation-start__header a { text-decoration: none; }
.creation-start__back { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #eeede9; color: #111; }
.creation-start__progress { margin-top: 28px; }
.creation-start__step { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: #7b7b77; }
.creation-start__step span:first-child { color: var(--creation-accent); }
.creation-start__segments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 15px; }
.creation-start__segments span { height: 5px; border-radius: 20px; background: #e6e5e0; }
.creation-start__segments .is-current { background: var(--creation-accent); }
.creation-start__main { width: min(100%, 588px); margin: 30px auto 0; }
.creation-start__intro { text-align: center; }
.creation-start__intro h1 { margin: 0; font-size: clamp(26px, 5.5vw, 36px); font-weight: 800; line-height: 1.6; letter-spacing: -.035em; }
.creation-start__intro p { margin: 12px auto 0; font-size: 14px; line-height: 1.95; color: #777772; }
.creation-start__mobile-break { display: none; }
.creation-start__main h2 { margin: 26px 0 22px; text-align: center; font-size: 18px; line-height: 1.8; font-weight: 700; }
.creation-start__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 464px; margin-inline: auto; }
.creation-start__choice { appearance: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; aspect-ratio: 1; width: 100%; padding: 18px 12px; border: 2px solid #e5e3df; border-radius: 25px; background: #fff; color: #353633; cursor: pointer; transition: background-color .18s, border-color .18s, color .18s; }
.creation-start__choice:hover { border-color: #c7c2ba; background: #fdfcf9; }
.creation-start__choice.is-selected { background: #fff0e8; border-color: var(--creation-accent); color: var(--creation-accent); }
.creation-start__choice-label { color: #22231f; font-size: 16px; font-weight: 600; line-height: 1.8; text-align: center; }
.creation-start__check { display: grid; place-items: center; width: 17px; height: 17px; margin-bottom: -10px; border: 1.5px solid transparent; border-radius: 50%; }
.creation-start__choice.is-selected .creation-start__check { border-color: currentColor; }
.creation-start__actions { max-width: 464px; margin: 26px auto 0; }
.creation-start__continue { display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 13px 18px; border: 0; border-radius: 100px; background: #111; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: background-color .18s; }
.creation-start__continue:hover:not(:disabled) { background: #33342f; }
.creation-start__continue:disabled { background: #e7e6e1; color: #92928c; cursor: default; }
.creation-start__hint { min-height: 24px; margin: 10px 0 0; text-align: center; font-size: 11px; line-height: 1.9; color: #7b7b77; }
.creation-start :is(a, button):focus-visible { outline: 3px solid #b74416; outline-offset: 4px; }
@media (max-width: 480px) {
  .creation-start__frame { padding: 18px 20px max(20px, env(safe-area-inset-bottom)); }
  .creation-start__progress { margin-top: 24px; }
  .creation-start__main { margin-top: 27px; }
  .creation-start__mobile-break { display: initial; }
  .creation-start__intro p { font-size: 12px; }
  .creation-start__main h2 { font-size: 16px; margin-top: 24px; margin-bottom: 18px; }
  .creation-start__grid { gap: 12px; }
  .creation-start__choice { gap: 10px; border-radius: 22px; padding: 12px 7px; }
  .creation-start__choice-label { font-size: 13px; }
  .creation-start__choice svg { width: 29px; height: 29px; }
  .creation-start__check svg { width: 11px; height: 11px; }
  .creation-start__actions { margin-top: 24px; }
  .creation-start__continue { font-size: 14px; }
